<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Margam — Minimalist Pure White Splash Screen & App Transition</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0F172A;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-900 flex items-center justify-center min-h-screen p-0 sm:p-6">
  <div id="root" class="w-full h-full flex items-center justify-center"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const MargamStandaloneSplash = () => {
      // Stages:
      // A = White canvas (0 - 400ms)
      // B = Logo entrance (400 - 1200ms)
      // C = Tagline reveal (1200 - 1800ms)
      // D = Subtle pulse / shimmer (1800 - 2500ms)
      // E = Smooth transition to app (2500 - 3100ms)
      const [stage, setStage] = useState('A');
      const [stageLabel, setStageLabel] = useState('Stage A: Pure White Canvas');

      const startSequence = useCallback(() => {
        setStage('A');
        setStageLabel('Stage A: Pure White Canvas (0 - 400ms)');

        const tB = setTimeout(() => {
          setStage('B');
          setStageLabel('Stage B: Logo Entrance (400 - 1200ms)');
        }, 400);

        const tC = setTimeout(() => {
          setStage('C');
          setStageLabel('Stage C: Tagline Reveal (1200 - 1800ms)');
        }, 1200);

        const tD = setTimeout(() => {
          setStage('D');
          setStageLabel('Stage D: Subtle Pulse & Shimmer (1800 - 2500ms)');
        }, 1800);

        const tE = setTimeout(() => {
          setStage('E');
          setStageLabel('Stage E: Smooth Transition to App (2500ms+)');
        }, 2500);

        return () => {
          clearTimeout(tB);
          clearTimeout(tC);
          clearTimeout(tD);
          clearTimeout(tE);
        };
      }, []);

      useEffect(() => {
        const cleanup = startSequence();
        return cleanup;
      }, [startSequence]);

      return (
        <div className="flex flex-col items-center justify-center w-full min-h-screen">
          {/* Top Control Bar */}
          <div className="fixed top-4 z-50 flex items-center gap-3 px-4 py-2 rounded-full bg-slate-800/90 backdrop-blur-md border border-slate-700 text-white text-xs shadow-2xl">
            <span className="flex items-center gap-2 font-medium text-slate-300">
              <span className={`w-2 h-2 rounded-full ${
                stage === 'A' ? 'bg-slate-400' :
                stage === 'B' ? 'bg-sky-400 animate-pulse' :
                stage === 'C' ? 'bg-indigo-400 animate-pulse' :
                stage === 'D' ? 'bg-pink-400 animate-ping' :
                'bg-emerald-400'
              }`} />
              {stageLabel}
            </span>
            <button
              onClick={startSequence}
              className="flex items-center gap-1.5 px-3 py-1 rounded-full bg-gradient-to-r from-pink-500 to-indigo-600 font-semibold text-[11px] text-white hover:opacity-95 active:scale-95 transition cursor-pointer shadow-sm"
            >
              <svg className="w-3 h-3 fill-white" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              Replay Animation
            </button>
          </div>

          {/* PHONE FRAME SIMULATOR (iOS Safe Area Proportions) */}
          <div className="relative w-full max-w-[400px] h-[100dvh] sm:h-[820px] sm:rounded-[44px] overflow-hidden shadow-2xl border-0 sm:border-[8px] sm:border-slate-800 bg-white">

            {/* STAGE E LIVE INTERFACE UNDERNEATH */}
            <div
              className={`absolute inset-0 z-10 flex flex-col justify-between bg-[#F8FAFC] transition-all duration-700 ease-out ${
                stage === 'E' ? 'opacity-100 scale-100' : 'opacity-0 scale-95 pointer-events-none'
              }`}
            >
              {/* App Header */}
              <header className="px-5 pt-8 pb-3 bg-white/95 backdrop-blur-md border-b border-slate-100 flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <img
                    src="./assets/images/margam_logo_3d.png"
                    alt="Margam"
                    className="w-8 h-8 object-contain"
                  />
                  <div>
                    <h2 className="text-base font-bold text-slate-900 tracking-tight leading-none">Margam</h2>
                    <p className="text-[10px] text-slate-500 font-medium mt-0.5">Shared journeys. Meaningful life partners.</p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <div className="px-2.5 py-1 rounded-full bg-pink-50 text-pink-600 text-[11px] font-semibold border border-pink-100">
                    Live
                  </div>
                </div>
              </header>

              {/* Feed Preview Content */}
              <main className="flex-1 overflow-y-auto p-4 space-y-3 no-scrollbar">
                <div className="p-4 rounded-2xl bg-white border border-slate-100 shadow-xs">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active Route Discovery</span>
                    <span className="text-xs font-bold text-sky-600 bg-sky-50 px-2 py-0.5 rounded-md">NH 544 Corridor</span>
                  </div>
                  <h3 className="text-sm font-bold text-slate-800">Kochi &rarr; Thrissur Daily Margam</h3>
                  <p className="text-xs text-slate-500 mt-1">4 compatible candidates traveling within &le;10 min detour of your route.</p>
                </div>

                <div className="p-4 rounded-2xl bg-white border border-slate-100 shadow-xs flex items-center gap-3">
                  <div className="w-12 h-12 rounded-full bg-gradient-to-tr from-pink-100 to-indigo-100 flex items-center justify-center text-pink-500 font-bold text-sm">
                    94%
                  </div>
                  <div>
                    <h4 className="text-sm font-bold text-slate-800">Senior Product Architect</h4>
                    <p className="text-xs text-slate-500">Shared values • Tech & Design • Kerala</p>
                  </div>
                </div>
              </main>

              {/* Bottom Navigation */}
              <nav className="h-16 bg-white border-t border-slate-100 flex items-center justify-around px-2 text-slate-400">
                <div className="flex flex-col items-center text-pink-600">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                  <span className="text-[10px] font-semibold mt-0.5">Discover</span>
                </div>
                <div className="flex flex-col items-center">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" strokeWidth="2"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 7v5l3 3"/></svg>
                  <span className="text-[10px] font-medium mt-0.5">Margams</span>
                </div>
                <div className="flex flex-col items-center">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/></svg>
                  <span className="text-[10px] font-medium mt-0.5">Map</span>
                </div>
                <div className="flex flex-col items-center">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                  <span className="text-[10px] font-medium mt-0.5">Chats</span>
                </div>
                <div className="flex flex-col items-center">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                  <span className="text-[10px] font-medium mt-0.5">Profile</span>
                </div>
              </nav>
            </div>

            {/* SPLASH OVERLAY (PURE WHITE CANVAS #FFFFFF) */}
            <div
              className={`absolute inset-0 z-40 bg-white flex flex-col items-center justify-center p-6 transition-all duration-500 ease-out ${
                stage === 'E' ? 'opacity-0 scale-105 pointer-events-none' : 'opacity-100 scale-100'
              }`}
            >
              {/* Centered Brand Presentation */}
              <div className="flex flex-col items-center justify-center relative">

                {/* Stage D: Luminous Ambient Shimmer Aura */}
                <div
                  className={`absolute rounded-full bg-pink-500/10 blur-2xl transition-all duration-700 ease-in-out pointer-events-none ${
                    stage === 'D' ? 'w-48 h-48 opacity-100 scale-110' : 'w-24 h-24 opacity-0 scale-75'
                  }`}
                />

                {/* Stage B: Official Margam 3D Logo Asset */}
                <div
                  className={`relative z-10 transition-all duration-700 ease-out ${
                    stage === 'A'
                      ? 'opacity-0 scale-90'
                      : stage === 'B' || stage === 'C'
                      ? 'opacity-100 scale-100'
                      : stage === 'D'
                      ? 'opacity-100 scale-[1.025]'
                      : 'opacity-100 scale-100'
                  }`}
                  style={{
                    filter: stage === 'D'
                      ? 'drop-shadow(0 12px 28px rgba(236,72,153,0.18))'
                      : 'drop-shadow(0 8px 24px rgba(236,72,153,0.08))'
                  }}
                >
                  <img
                    src="./assets/images/margam_logo_3d.png"
                    alt="Margam"
                    className="w-36 h-auto object-contain select-none"
                    draggable="false"
                  />
                </div>

                {/* Stage C: Single Exact Tagline */}
                <div
                  className={`mt-6 transition-all duration-600 ease-out ${
                    stage === 'A' || stage === 'B'
                      ? 'opacity-0 translate-y-3'
                      : 'opacity-100 translate-y-0'
                  }`}
                >
                  <p className="text-[15.5px] font-medium text-slate-600 tracking-wide text-center">
                    Shared journeys. Meaningful life partners.
                  </p>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<MargamStandaloneSplash />);
  </script>
</body>
</html>
